version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collab_postgres
    restart: always
    environment:
      POSTGRES_USER: collab_user
      POSTGRES_PASSWORD: collab_secret_password
      POSTGRES_DB: collab_workspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab_user -d collab_workspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collab_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab_workspace_app
    restart: always
    environment:
      DATABASE_URL: "postgresql://collab_user:collab_secret_password@postgres:5432/collab_workspace?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: "4000"
      WS_PORT: "1234"
      NODE_ENV: "production"
    ports:
      - "4000:4000"
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
